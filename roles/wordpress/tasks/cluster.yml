---
- name: Wait until MySQL master is ready
  community.mysql.mysql_info:
    login_host: 127.0.0.1
    login_port: 3306
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  register: master_ping
  retries: 20
  delay: 3
  until: master_ping is succeeded
  changed_when: false

- name: Dump wordpress DB from master
  community.mysql.mysql_db:
    state: dump
    name: "{{ wordpress_db_name }}"
    login_host: 127.0.0.1
    login_port: 3306
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
    target: /tmp/wordpress.sql
    dump_extra_args: "--single-transaction --routines --triggers --events"

- name: Ensure replication user exists on master
  community.mysql.mysql_user:
    login_host: 127.0.0.1
    login_port: 3306
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
    name: replicator
    host: "%"
    password: "{{ replication_password }}"
    priv: "*.*:REPLICATION SLAVE"
    state: present
    auth_plugin: "{{ repl_auth_plugin | default(omit) }}"

- name: Get master binlog coordinates
  community.mysql.mysql_replication:
    mode: getprimary
    login_host: 127.0.0.1
    login_port: 3306
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  register: master_status
  changed_when: false

- name: Wait until MySQL slave is ready
  community.mysql.mysql_info:
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  register: slave_ping
  retries: 20
  delay: 3
  until: slave_ping is succeeded
  changed_when: false

- name: Stop slave replication 
  community.mysql.mysql_replication:
    mode: stopreplica
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  failed_when: false

- name: Import dump into slave
  community.mysql.mysql_db:
    state: import
    name: "{{ wordpress_db_name }}"
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
    target: /tmp/wordpress.sql

- name: Configure slave -> changeprimary
  community.mysql.mysql_replication:
    mode: changeprimary
    primary_host: "{{ mysql_master }}"
    primary_port: 3306
    primary_user: replicator
    primary_password: "{{ replication_password }}"
    primary_log_file: "{{ master_status.File }}"
    primary_log_pos: "{{ master_status.Position }}"
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"

- name: Start slave replication
  community.mysql.mysql_replication:
    mode: startreplica
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"

- name: Ensure slave is read-only
  community.mysql.mysql_variables:
    login_host: 127.0.0.1
    login_port: 3307
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
    variable: read_only
    value: "ON"
